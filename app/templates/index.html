<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>EcoDigest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #1e1e1e;
            --text-primary: #ececf1;
            --text-secondary: #a0a0a0;
            --user-bubble: #343541;
            --assistant-bubble: #444654;
            --highlight: #19c37d;
            --danger: #e66666;
            --border: #2d2d2d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 850px;
            height: 90vh;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: #101010;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scrollbar-color: var(--assistant-bubble) var(--bg-secondary);
            scrollbar-width: thin;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            line-height: 1.6;
            border-radius: 10px;
            padding: 1rem;
            animation: fadeIn 0.25s ease-in;
        }

        .message.user {
            background-color: var(--user-bubble);
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        .message.assistant {
            background-color: var(--assistant-bubble);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .role-icon {
            font-size: 1.2rem;
            min-width: 35px;
            height: 35px;
            text-align: center;
            line-height: 35px;
            border-radius: 6px;
            background: var(--border);
        }

        .user .role-icon {
            background-color: var(--highlight);
            color: var(--bg-primary);
        }

        .message-content {
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-content strong {
            display: none;
        }

        form {
            display: flex;
            border-top: 1px solid var(--border);
            background-color: #101010;
            padding: 0.75rem;
        }

        textarea {
            flex-grow: 1;
            background-color: var(--user-bubble);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            resize: none;
            padding: 10px 15px;
            line-height: 1.5;
            height: 55px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--highlight);
        }

        button {
            background-color: var(--highlight);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-left: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #15a86a;
        }

        .footer-buttons {
            display: flex;
            justify-content: flex-end;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            background-color: #101010;
        }

        .clear-btn {
            background-color: var(--danger);
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .clear-btn:hover {
            background-color: #c75656;
        }

        .error {
            color: var(--danger);
            text-align: center;
            padding: 10px;
            background-color: rgba(230, 102, 102, 0.1);
            border-radius: 6px;
            margin: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            textarea {
                height: 60px;
                margin-bottom: 10px;
            }

            button {
                width: 100%;
                margin: 0;
                padding: 12px;
            }

            form {
                flex-direction: column;
            }

            .footer-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EcoDigest</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div id="chat-box">
            {% for msg in messages %}
                <div class="message {{ msg.role }}">
                    <div class="role-icon">
                        {% if msg.role == 'user' %}
                            U
                        {% else %}
                            🤖
                        {% endif %}
                    </div>
                    <div class="message-content">
                        {{ msg.content | safe }}
                    </div>
                </div>
            {% endfor %}
        </div>

        <form method="post" action="{{ url_for('index') }}">
            <textarea name="prompt" placeholder="Ask an question..." required></textarea>
            <button type="submit">Send</button>
        </form>

        <div class="footer-buttons">
            <form method="get" action="{{ url_for('clear') }}">
                <button type="submit" class="clear-btn">Clear Chat</button>
            </form>
        </div>
    </div>
</body>
</html>
